اعداد مخلوط با شکل و تبدیل به کسر بزرگ‌تر از واحد.",descriptionEn:"Convert between mixed numbers and improper fractions.",status:"mastered",demoProgress:95,questionsAnswered:8,totalQuestions:8,estimatedMinutes:10},{id:"sk-g7-linear",code:"M7-AL-01",grade:7,topicId:"top-g7-algebra",titleFa:"مقدار عددی عبارت جبری",titleEn:"Evaluating Algebraic Expressions",descriptionFa:"جایگذاری عدد به جای متغیر و محاسبه حاصل عبارت جبری.",descriptionEn:"Substitute values for variables and simplify expressions.",status:"not_started",demoProgress:0,questionsAnswered:0,totalQuestions:8,estimatedMinutes:12}],Cr=[{id:"q-fr-1",skillId:"sk-add-fractions",type:"multiple_choice",promptFa:"حاصل جمع دو کسر زیر برابر با کدام گزینه است؟ (به تصویر هم‌مخرج‌شده دقت کن)",promptEn:"What is the sum of the two fractions shown below?",hintFa:"مخرج مشترک ۲ و ۴ عدد ۴ است؛ ابتدا ۱/۲ را به صورت ۲/۴ بنویس.",hintEn:"The common denominator of 2 and 4 is 4; rewrite 1/2 as 2/4 first.",visualType:"fraction_bars",visualMeta:{aLabel:"1/2 + 1/4",bLabel:"2/4 + 1/4"},options:[{id:"a",labelFa:"۲/۶",labelEn:"2/6"},{id:"b",labelFa:"۳/۴",labelEn:"3/4"},{id:"c",labelFa:"۲/۴",labelEn:"2/4"},{id:"d",labelFa:"۳/۸",labelEn:"3/8"}],correctAnswer:"b",correctDisplayFa:"۳/۴ (سه چهارم)",correctDisplayEn:"3/4",explanationFa:"چون مخرج ۴ مضربی از ۲ است، کسر ۱/۲ را در ۲ ضرب می‌کنیم تا به ۲/۴ تبدیل شود. سپس ۲/۴ + ۱/۴ برابر است با ۳/۴.",explanationEn:"Rewrite 1/2 as the equivalent fraction 2/4. Adding the numerators gives 2/4 + 1/4 = 3/4.",solvingStepsFa:["گام ۱: مخرج مشترک ۲ و ۴ را پیدا می‌کنیم که برابر با ۴ است.","گام ۲: صورت و مخرج کسر ۱/۲ را در ۲ ضرب می‌کنیم: ۲/۴.","گام ۳: حالا صورت‌ها را جمع می‌کنیم و مخرج ۴ ثابت می‌ماند: (۲ + ۱) / ۴ = ۳/۴."],solvingStepsEn:["Step 1: Find the least common denominator of 2 and 4, which is 4.","Step 2: Multiply numerator and denominator of 1/2 by 2 to get 2/4.","Step 3: Add numerators while keeping denominator 4: (2 + 1)/4 = 3/4."],difficulty:"basic"},{id:"q-fr-2",skillId:"sk-add-fractions",type:"multiple_choice",promptFa:"آوا ۱/۳ از کتاب داستان را روز شنبه و ۲/۵ آن را روز یکشنبه خواند. او در مجموع چه کسری از کتاب را خوانده است؟",promptEn:"Ava read 1/3 of a storybook on Saturday and 2/5 on Sunday. What fraction of the book did she read in total?",hintFa:"کوچک‌ترین مضرب مشترک ۳ و ۵ عدد ۱۵ است.",hintEn:"The least common multiple of 3 and 5 is 15.",options:[{id:"a",labelFa:"۳/۸",labelEn:"3/8"},{id:"b",labelFa:"۱۱/۱۵",labelEn:"11/15"},{id:"c",labelFa:"۷/۱۵",labelEn:"7/15"},{id:"d",labelFa:"۳/۱۵",labelEn:"3/15"}],correctAnswer:"b",correctDisplayFa:"۱۱/۱۵ (یازده پانزدهم)",correctDisplayEn:"11/15",explanationFa:"برای جمع ۱/۳ و ۲/۵ مخرج مشترک ۱۵ می‌گیریم: ۱/۳ برابر ۵/۱۵ و ۲/۵ برابر ۶/۱۵ می‌شود. مجموع ۵/۱۵ و ۶/۱۵ برابر ۱۱/۱۵ است.",explanationEn:"Using denominator 15: 1/3 = 5/15 and 2/5 = 6/15. Their sum is 5/15 + 6/15 = 11/15.",solvingStepsFa:["گام ۱: مخرج‌ها ۳ و ۵ هستند؛ کوچک‌ترین مضرب مشترک آن‌ها ۳ × ۵ = ۱۵ است.","گام ۲: تبدیل به کسر مساوی با مخرج ۱۵: ۱/۳ = ۵/۱۵ و ۲/۵ = ۶/۱۵.","گام ۳: جمع صورت‌ها: ۵ + ۶ = ۱۱، پس پاسخ برابر ۱۱/۱۵ است (صورت‌ها و مخرج‌ها را مستقیم با هم جمع نمی‌کنیم)."],solvingStepsEn:["Step 1: Denominators are 3 and 5; LCM is 15.","Step 2: Convert fractions: 1/3 = 5/15 and 2/5 = 6/15.","Step 3: Add numerators: 5 + 6 = 11, giving 11/15."],difficulty:"medium"},{id:"q-fr-3",skillId:"sk-add-fractions",type:"numeric_input",promptFa:"در تساوی  ۱/۶ + ۱/۲ = [؟]/۶  عدد مناسب به جای علامت سؤال چند است؟ (فقط عدد صورت را بنویس)",promptEn:"In the equation 1/6 + 1/2 = □/6, what number belongs in the box? (Enter numerator only)",hintFa:"کسر ۱/۲ چند ششم است؟ سپس آن را با ۱ ششم جمع کن.",hintEn:"How many sixths equal 1/2? Add 1 sixth to that.",correctAnswer:"4",correctDisplayFa:"۴ (چون ۴/۶ مساوی ۱/۶ + ۳/۶ است)",correctDisplayEn:"4 (since 1/6 + 3/6 = 4/6)",explanationFa:"کسر ۱/۲ برابر با ۳/۶ است. از جمع ۱/۶ و ۳/۶ به ۴/۶ می‌رسیم، پس عدد داخل مربع ۴ است.",explanationEn:"1/2 equals 3/6. Adding 1/6 + 3/6 gives 4/6, so the missing numerator is 4.",solvingStepsFa:["گام ۱: کسر ۱/۲ را با ضرب صورت و مخرج در ۳ به ۳/۶ تبدیل می‌کنیم.","گام ۲: عبارت به شکل ۱/۶ + ۳/۶ درمی‌آید.","گام ۳: جمع صورت‌ها ۱ + ۳ = ۴ است."],solvingStepsEn:["Step 1: Rewrite 1/2 as 3/6.","Step 2: Add 1/6 + 3/6.","Step 3: Numerator is 1 + 3 = 4."],difficulty:"basic"},{id:"q-dc-1",skillId:"sk-mult-decimals",type:"multiple_choice",promptFa:"حاصل ضرب  ۰/۴ × ۰/۳  کدام گزینه است؟",promptEn:"What is the product of 0.4 × 0.3?",hintFa:"۴ دهم ضرب‌در ۳ دهم چند صدم می‌شود؟ به تعداد رقم‌های اعشار دقت کن!",hintEn:"4 tenths times 3 tenths gives hundredths. Count total decimal places!",visualType:"decimal_grid",options:[{id:"a",labelFa:"۱/۲",labelEn:"1.2"},{id:"b",labelFa:"۰/۱۲",labelEn:"0.12"},{id:"c",labelFa:"۰/۷",labelEn:"0.7"},{id:"d",labelFa:"۰/۰۱۲",labelEn:"0.012"}],correctAnswer:"b",correctDisplayFa:"۰/۱۲ (دوازده صدم)",correctDisplayEn:"0.12",explanationFa:"۴ × ۳ برابر ۱۲ است. چون هر کدام از دو عدد یک رقم اعشار دارند، حاصل‌ضرب باید ۲ رقم اعشار داشته باشد: ۰/۱۲.",explanationEn:"4 × 3 = 12. Since each factor has 1 decimal place, the product has 2 decimal places: 0.12.",solvingStepsFa:["گام ۱: بدون در نظر گرفتن ممیز ضرب می‌کنیم: ۴ × ۳ = ۱۲.","گام ۲: تعداد کل رقم‌های اعشار دو عدد را می‌شماریم: ۱ + ۱ = ۲ رقم اعشار.","گام ۳: دو رقم از سمت راست جدا می‌کنیم و می‌نویسیم: ۰/۱۲."],solvingStepsEn:["Step 1: Multiply whole numbers: 4 × 3 = 12.","Step 2: Count decimal places: 1 + 1 = 2 places.","Step 3: Place decimal point two digits from the right: 0.12."],difficulty:"basic"},{id:"q-dc-2",skillId:"sk-mult-decimals",type:"multiple_choice",promptFa:"قیمت هر متر روبان ۲/۵ هزار تومان است. قیمت ۱/۴ متر از همین روبان چند هزار تومان می‌شود؟",promptEn:"One meter of ribbon costs 2.5 units. How much does 1.4 meters cost?",hintFa:"۲۵ × ۱۴ برابر ۳۵۰ است؛ حالا دو رقم اعشار جدا کن.",hintEn:"25 × 14 = 350; now place two decimal digits.",options:[{id:"a",labelFa:"۳/۵",labelEn:"3.5"},{id:"b",labelFa:"۳۵",labelEn:"35"},{id:"c",labelFa:"۰/۳۵",labelEn:"0.35"},{id:"d",labelFa:"۲/۹",labelEn:"2.9"}],correctAnswer:"a",correctDisplayFa:"۳/۵ (یا ۳/۵۰)",correctDisplayEn:"3.5",explanationFa:"۲۵ × ۱۴ = ۳۵۰ و با جدا کردن دو رقم اعشار به ۳/۵۰ یعنی ۳/۵ می‌رسیم.",explanationEn:"25 × 14 = 350. Placing two decimal places gives 3.50 = 3.5.",solvingStepsFa:["گام ۱: ابتدا تخمین می‌زنیم: عددی کمی بیشتر از ۲/۵ انتظار داریم.","گام ۲: ضرب بدون ممیز: ۲۵ × ۱۴ = ۳۵۰.","گام ۳: جدا کردن ۲ رقم اعشار: ۳/۵۰ = ۳/۵."],solvingStepsEn:["Step 1: Estimate: slightly more than 2.5.","Step 2: Multiply 25 × 14 = 350.","Step 3: Two decimal places give 3.50 = 3.5."],difficulty:"medium"},{id:"q-gm-1",skillId:"sk-perimeter-area",type:"multiple_choice",promptFa:"یک باغچه مستطیل‌شکل به طول ۸ متر و عرض ۵ متر داریم. مساحت و محیط آن به ترتیب کدام است؟",promptEn:"A rectangular garden is 8 m long and 5 m wide. What are its area and perimeter respectively?",hintFa:"مساحت = طول × عرض (مترمربع) و محیط = ۲ × (طول + عرض) (متر).",hintEn:"Area = length × width; Perimeter = 2 × (length + width).",visualType:"geometry_rect",visualMeta:{widthCm:8,heightCm:5},options:[{id:"a",labelFa:"مساحت ۲۶ مترمربع و محیط ۴۰ متر",labelEn:"Area 26 sq m, Perimeter 40 m"},{id:"b",labelFa:"مساحت ۴۰ مترمربع و محیط ۲۶ متر",labelEn:"Area 40 sq m, Perimeter 26 m"},{id:"c",labelFa:"مساحت ۴۰ مترمربع و محیط ۱۳ متر",labelEn:"Area 40 sq m, Perimeter 13 m"},{id:"d",labelFa:"مساحت ۱۳ مترمربع و محیط ۲۶ متر",labelEn:"Area 13 sq m, Perimeter 26 m"}],correctAnswer:"b",correctDisplayFa:"مساحت ۴۰ مترمربع و محیط ۲۶ متر",correctDisplayEn:"Area 40 sq m, Perimeter 26 m",explanationFa:"مساحت سطح داخل مستطیل است: ۸ × ۵ = ۴۰ مترمربع. محیط طول دورتادور باغچه است: ۲ × (۸ + ۵) = ۲۶ متر.",explanationEn:"Area covers the inside: 8 × 5 = 40 sq m. Perimeter goes around all 4 sides: 2 × (8 + 5) = 26 m.",solvingStepsFa:["گام ۱: برای مساحت، طول را در عرض ضرب می‌کنیم: ۸ × ۵ = ۴۰ مترمربع.","گام ۲: برای محیط، مجموع طول و عرض را دو برابر می‌کنیم: ۲ × (۸ + ۵) = ۲ × ۱۳ = ۲۶ متر.","گام ۳: دقت کن محیط و مساحت جابه‌جا نشوند!"],solvingStepsEn:["Step 1: Multiply length × width for area: 8 × 5 = 40 sq m.","Step 2: Double (length + width) for perimeter: 2 × (8 + 5) = 26 m.","Step 3: Keep area and perimeter units distinct."],difficulty:"basic"},{id:"q-gm-2",skillId:"sk-perimeter-area",type:"numeric_input",promptFa:"محیط یک مربع ۳۶ سانتی‌متر است. مساحت این مربع چند سانتی‌مترمربع است؟ (فقط عدد بنویس)",promptEn:"The perimeter of a square is 36 cm. What is its area in square centimeters?",hintFa:"ابتدا ۳۶ را بر ۴ تقسیم کن تا طول یک ضلع مربع به دست آید.",hintEn:"First divide 36 by 4 to find one side length.",correctAnswer:"81",correctDisplayFa:"۸۱ سانتی‌مترمربع",correctDisplayEn:"81 sq cm",explanationFa:"چون مربع ۴ ضلع مساوی دارد، هر ضلع ۳۶ ÷ ۴ = ۹ سانتی‌متر است و مساحت ۹ × ۹ = ۸۱ می‌شود.",explanationEn:"Each side is 36 ÷ 4 = 9 cm, so the area is 9 × 9 = 81 sq cm.",solvingStepsFa:["گام ۱: طول یک ضلع مربع = محیط ÷ ۴ = ۳۶ ÷ ۴ = ۹ سانتی‌متر.","گام ۲: مساحت مربع = یک ضلع × خودش = ۹ × ۹ = ۸۱ سانتی‌مترمربع."],solvingStepsEn:["Step 1: Side length = 36 ÷ 4 = 9 cm.","Step 2: Area = 9 × 9 = 81 sq cm."],difficulty:"challenge"}],bu=[{id:"asn-01",titleFa:"تمرین جمع کسرها با مخرج نامساوی",titleEn:"Practice: Adding Fractions with Unlike Denominators",skillIds:["sk-add-fractions"],classId:"cls-6a",recipientType:"whole_class",recipientCount:24,teacherNameFa:"خانم احمدی",teacherNameEn:"Ms. Ahmadi",dueDateFa:"فردا، ۱۸ آبان • ساعت ۲۰:۰۰",dueDateEn:"Tomorrow, Nov 9 • 20:00",dueIso:"2026-11-09",instructionsFa:"لطفاً پیش از حل هر سؤال، مخرج مشترک را روی کاغذ بنویسید و عجله نکنید.",instructionsEn:"Write down the common denominator before selecting your final answer.",status:"in_progress",completedCount:14,inProgressCount:6,notStartedCount:4,studentProgressPercent:64},{id:"asn-02",titleFa:"مرور محیط و مساحت مستطیل و شکل‌های ترکیبی",titleEn:"Review: Perimeter & Area of Shapes",skillIds:["sk-perimeter-area"],classId:"cls-6a",recipientType:"selected_students",recipientStudentIds:["stu-01","stu-03","stu-07","stu-12","stu-19"],recipientCount:5,teacherNameFa:"خانم احمدی",teacherNameEn:"Ms. Ahmadi",dueD
